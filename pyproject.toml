[project]
name = "acdesign"
version = "0.1.0"
description = "Aircraft conceptual design from scratch: mission requirements, weight sizing, constraint analysis, wing/tail sizing, structural and stability checks, built on the four From Scratch pillar packages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri", email = "gmcavalheri@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "aero",
    "structures",
    "propulsion",
    "flightdyn",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
    "ruff>=0.6",
]

# The four pillar projects (AERO-01..04), pinned to the commits this project was built against.
[tool.uv.sources]
aero = { git = "https://github.com/GMCavalheri/aerodynamics-from-scratch", rev = "44758a4a134034440eeb78ded7a17b5e528933cd" }
structures = { git = "https://github.com/GMCavalheri/aircraft-structures-from-scratch", rev = "48132da610e4a5298e671701aa0549810bcd954b" }
propulsion = { git = "https://github.com/GMCavalheri/propulsion-from-scratch", rev = "653b4e40c206c35fa9c3898bf5bbe69ae6e30c43" }
flightdyn = { git = "https://github.com/GMCavalheri/flight-dynamics-from-scratch", rev = "5c0bd19490115162a56c8c08c87ff55013d711a3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acdesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",    # single-letter math names (l, I) are idiomatic here
    "SIM300",  # false positives on uppercase math attributes
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts (and the tests, via tests/conftest.py) import their sibling modules directly
known-local-folder = ["reference", "reference_aircraft"]
